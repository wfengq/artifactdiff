[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "artifactdiff"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44,<47",
  "jinja2>=3.1,<4",
  "mcp>=1.13,<2",
  "pdfplumber>=0.11,<1",
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
  "pypdfium2>=4.30,<6",
  "python-docx>=1.1,<2",
  "PyYAML>=6.0,<7",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = ["beautifulsoup4>=4.12,<5", "build>=1.2", "mypy>=1.15", "pytest>=8.3", "reportlab>=4.2", "ruff>=0.11"]

[project.scripts]
artifactdiff = "artifactdiff.cli:app"
artifactdiff-mcp = "artifactdiff.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/artifactdiff"]

[tool.hatch.build.targets.wheel.force-include]
"src/artifactdiff/reporting/template.html" = "artifactdiff/reporting/template.html"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = true
