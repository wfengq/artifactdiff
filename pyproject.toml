[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "artifactdiff"
version = "0.1.0"
description = "Local-first contract edit verification gate: check a DOCX/PDF candidate against a pre-approved policy and store a verifiable Review Bundle."
readme = "README.md"
license = "MIT"
authors = [
  { name = "Wei Qihang" },
]
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44,<47",
  "jinja2>=3.1,<4",
  "mcp>=1.13,<2",
  "pdfplumber>=0.11,<1",
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
  "pypdfium2>=4.30,<6",
  "python-docx>=1.1,<2",
  "PyYAML>=6.0,<7",
  "starlette>=0.37,<1",
  "typer>=0.15,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["beautifulsoup4>=4.12,<5", "build>=1.2", "httpx>=0.27,<1", "mypy>=1.15", "pytest>=8.3", "reportlab>=4.2", "ruff>=0.11"]

[project.urls]
Homepage = "https://github.com/wfengq/artifactdiff"
Repository = "https://github.com/wfengq/artifactdiff"
Issues = "https://github.com/wfengq/artifactdiff/issues"
"Bug Tracker" = "https://github.com/wfengq/artifactdiff/issues"

[project.scripts]
artifactdiff = "artifactdiff.cli:app"
artifactdiff-mcp = "artifactdiff.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/artifactdiff"]

[tool.hatch.build.targets.wheel.force-include]
"src/artifactdiff/reporting/template.html" = "artifactdiff/reporting/template.html"
"src/artifactdiff/reporting/contract_template.html" = "artifactdiff/reporting/contract_template.html"
"src/artifactdiff/review_web/assets/index.html" = "artifactdiff/review_web/assets/index.html"
"src/artifactdiff/review_web/assets/app.js" = "artifactdiff/review_web/assets/app.js"
"src/artifactdiff/review_web/assets/styles.css" = "artifactdiff/review_web/assets/styles.css"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = true
