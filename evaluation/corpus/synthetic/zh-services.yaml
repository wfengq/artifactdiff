paragraphs:
  - 技术服务合同
  - 第一条 合同主体
  - 甲方：上海示例科技有限公司；乙方：北京样例信息技术有限公司。本合同于2026年8月4日签订。
  - 第二条 付款条件
  - 甲方应于验收合格后30天内支付服务费。每期发票最多包含12个项目。
  - 第三条 费用
  - 服务费总额为人民币120,000元。逾期付款按每日0.5%支付违约金。
  - 第四条 期限
  - 本合同有效期为24个月。任何一方可以提前60天书面通知解除本合同。
  - 第五条 保密
  - 乙方不得披露甲方的保密信息。乙方应在合同终止后返还全部资料。
  - 第六条 一般条款
  - 本合同适用中华人民共和国法律。
