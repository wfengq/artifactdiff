paragraphs:
  - 采购合同
  - 第一条 合同主体
  - 甲方：杭州示例贸易有限公司；乙方：苏州样例制造有限公司。本合同于2026年9月1日签订。
  - 第二条 交货
  - 乙方应于收到订单后15天内交付货物。每批货物不超过500件。
  - 第三条 价款
  - 合同总价为人民币48,000元。超出预测数量的订单享受2%的折扣。
  - 第四条 质量保证
  - 质量保证期为交货后18个月。甲方可以在验收后10天内退回不合格货物。
  - 第五条 独家供应
  - 乙方不得向甲方的竞争对手销售该货物。乙方应保存完整的生产记录。
  - 第六条 一般条款
  - 通知以书面形式送达时生效。
