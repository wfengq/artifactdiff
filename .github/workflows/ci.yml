name: Python checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint (baseline error checks)
        run: ruff check --select E4,E7,E9,F src tests
      - name: Test
        run: python -m pytest -q
